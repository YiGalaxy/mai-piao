# ============================================================
# RocketMQ 5.3.1 broker 配置（本地开发）
# ============================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ---- 对外通告给客户端的 broker 地址 ----
# Spring Boot 应用跑在宿主机上（docker 之外），所以 broker 必须通告
# 127.0.0.1。如果哪天把应用也搬进 docker，这里要改成 broker 容器名。
brokerIP1 = 127.0.0.1

# ---- 消息保留 ----
deleteWhen = 04
fileReservedTime = 48

# ---- 持久化 ----
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ---- Topics（主题）----
# 开发期的便利：允许生产者往从未创建过的 topic 发消息。
# 生产环境绝不要开这个。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 默认的 topic 队列数。数值越大，消费端并行度越高。
defaultTopicQueueNums = 8

# ---- 延时消息支持 ----
# RocketMQ 5.x 通过时间轮支持任意时间戳的延时消息。保留 messageDelayLevel
# 是为了向后兼容经典的 18 级方案（1s 5s 10s 30s 1m ... 2h）。
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h

# ---- 线程池 ----
sendMessageThreadPoolNums = 16
pullMessageThreadPoolNums = 16

# ---- 事务消息（下单 / 支付流程会用到）----
transactionCheckInterval = 5000
transactionTimeOut = 6000
transactionCheckMax = 15
