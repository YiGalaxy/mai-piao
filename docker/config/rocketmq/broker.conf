# ============================================================
# RocketMQ 5.3.1 broker configuration (local development)
# ============================================================

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# ---- Broker address advertised to clients ----
# Spring Boot apps run on the HOST (outside docker), so the broker
# must advertise 127.0.0.1. If you move the apps into docker too,
# change this to the broker container name.
brokerIP1 = 127.0.0.1

# ---- Retention ----
deleteWhen = 04
fileReservedTime = 48

# ---- Persistence ----
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# ---- Topics ----
# Dev convenience: allow producers to send to topics that were never created.
# Do NOT enable this in production.
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# Default topic queue count. Higher = more consumer parallelism.
defaultTopicQueueNums = 8

# ---- Delay message support ----
# RocketMQ 5.x supports arbitrary-timestamp delay messages via the
# timer wheel. messageDelayLevel is kept for backward compatibility
# with the classic 18-level scheme (1s 5s 10s 30s 1m ... 2h).
messageDelayLevel = 1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h

# ---- Thread pools ----
sendMessageThreadPoolNums = 16
pullMessageThreadPoolNums = 16

# ---- Transaction messages (used by order / pay flows) ----
transactionCheckInterval = 5000
transactionTimeOut = 6000
transactionCheckMax = 15
