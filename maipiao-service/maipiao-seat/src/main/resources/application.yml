server:
  port: 9003

spring:
  application:
    name: maipiao-seat

  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3309}/maipiao_event?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:maipiao123}
    hikari:
      minimum-idle: 2
      # Read-mostly service: the pool is small on purpose, because the hot path
      # (locking) never touches the database at all.
      maximum-pool-size: 10
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms

mysqldb:
  # Kept separate from the datasource above so the read-only intent is visible.
  read-only: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.maipiao.seat.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

maipiao:
  jwt:
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}
  seat:
    # 用户在支付页停留期间，座位保持占用的时长。
    lock-minutes: 15
    # bitmap 缺失时用账本重建它。见 SeatMapService。
    rebuild-on-miss: true
    # 超时回收：锁了座却没下单的那些座位，由 SeatExpiryJob 按这个节奏去找回来。
    expiry-interval-ms: 30000
    # 每个场次每轮的回收上限。不限量的话，一次 Redis 抖动之后攒下的几千个到期持有
    # 会在同一轮里一个接一个跑完，期间这个场次的正常加锁全在排队。
    expiry-batch: 200

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.maipiao: debug
