server:
  port: 9001

spring:
  application:
    name: maipiao-user

  # Pull additional config from Nacos when it exists.
  # `optional:` is deliberate - the service must start on a fresh checkout
  # where nothing has been published to Nacos yet. Everything needed to run
  # locally has a default in this file; Nacos config overrides it when present.
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      # 8858, not the default 8848 - another project's Nacos owns 8848 on this machine
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Port 3309: 3306 is a native MySQL service on this machine
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3309}/maipiao_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:maipiao123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      # Port 6381: 6379 belongs to another project on this machine
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.maipiao.user.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # Snowflake ids generated by MyBatis-Plus for entity primary keys.
      # Business numbers (order_no, payment_no) use our own generator instead,
      # because they need to be readable strings with a known prefix.
      #
      # No logical-delete column in this schema: rows are never soft-deleted,
      # so a `logic-delete-field` here would silently change every query.
      id-type: assign_id

maipiao:
  jwt:
    # Must match every other service. Override per environment.
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}
    expire-minutes: 120
    admin-expire-minutes: 60
  demo:
    # Creates the demo accounts on startup if they are missing.
    # Disable in any shared environment.
    init-users: true

# Branch participant in G1: coupon locking rolls back with the order that
# asked for it. See maipiao-movie for why registry/config are `file`.
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: maipiao_tx_group
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      maipiao_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.maipiao: debug
    # Uncomment to see every SQL statement with its parameters:
    # com.maipiao.user.mapper: debug
