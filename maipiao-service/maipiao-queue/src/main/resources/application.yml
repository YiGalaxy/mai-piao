server:
  port: 9008

spring:
  application:
    name: maipiao-queue

  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

  # No datasource. A queue lives for minutes and the seat ledger behind it is
  # what has to survive; keeping the line in a table would mean a write on the
  # hottest path in the system for data nobody would ever read.

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # Larger than the other services: the dispatcher and the join path
          # are both Redis-bound, and at peak this is the busiest service there
          # is - by design, because everything it absorbs is a request the seat
          # service never sees.
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 2000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

maipiao:
  jwt:
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}

  queue:
    # See QueueProperties for what each of these means and why.
    admit-factor: 1.5
    token-seconds: 300
    dispatch-interval-ms: 200
    max-batch: 500

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.maipiao: debug
    # The dispatcher logs a line every time it admits anyone. At a 200ms tick
    # that is the noisiest thing in the service, and it is only interesting
    # while a sale is actually running.
    com.maipiao.queue.service.AdmissionDispatcher: info
