server:
  port: 9008

spring:
  application:
    name: maipiao-queue

  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

  # 不要数据源。队列只活几分钟，真正要活下来的是它背后的座位账本；
  # 把排队存进表里，等于在系统最热的路径上多一次写入，
  # 而为的是一批根本不会有人去读的数据。

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # 比别的服务配得大：放行器和入队路径都压在 Redis 上，
          # 而峰值时这里是全系统最忙的服务 —— 这是设计使然，
          # 因为它挡下来的每一个请求，
          # 座位服务都根本不会看到。
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 2000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

maipiao:
  jwt:
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}

  queue:
    # 每一项是什么意思、为什么这么定，见 QueueProperties。
    admit-factor: 1.5
    token-seconds: 300
    dispatch-interval-ms: 200
    max-batch: 500

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.maipiao: debug
    # 放行器每放一个人就记一行日志。200ms 一跳的节奏下，
    # 它是这个服务里最吵的东西，
    # 而它只有在一场售卖真的在跑的时候才值得看。
    com.maipiao.queue.service.AdmissionDispatcher: info
