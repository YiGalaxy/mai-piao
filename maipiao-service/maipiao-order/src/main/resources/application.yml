server:
  port: 9004

spring:
  application:
    name: maipiao-order

  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3309}/maipiao_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:maipiao123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ------------------------------------------------------------
  # RocketMQ. The timeout-cancel message is the primary path for
  # releasing seats; the scheduled sweep is the fallback.
  # ------------------------------------------------------------
rocketmq:
  name-server: ${ROCKETMQ_ADDR:127.0.0.1:9876}
  producer:
    group: maipiao-order-producer
    send-message-timeout: 5000
    retry-times-when-send-failed: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.maipiao.order.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

# ============================================================
# Seata client
#
# The TC address is configured directly rather than discovered through Nacos.
#
# Why: the Seata server runs in a container and registers itself with the IP
# it detects, which is the Docker-internal one. The services run on the host
# and cannot route to 172.x.x.x, so Nacos discovery hands back an address that
# is guaranteed unreachable:
#     can not connect to [172.28.0.8:8091]
# which reads like the TC is down when it is perfectly healthy.
#
# SEATA_IP is the documented way to override what gets registered, but it is
# documented not to accept 127.0.0.1, and a host LAN address would be a
# hard-coded value that changes with DHCP. Pointing the client straight at the
# published port removes the problem instead of working around it.
#
# To switch back to discovery once the services also run in Docker, change
# registry.type to `nacos` and drop the grouplist.
# ============================================================
seata:
  enabled: true
  application-id: ${spring.application.name}
  # Must match service.vgroupMapping on the server, or startup fails with
  # "can not get cluster name in registry config".
  tx-service-group: maipiao_tx_group
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      maipiao_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file

maipiao:
  jwt:
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}
  order:
    lock-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.maipiao: debug
    io.seata: info
