server:
  port: 9004

spring:
  application:
    name: maipiao-order

  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3309}/maipiao_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:maipiao123}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

# RocketMQ is reserved for delayed messages; OrderTimeoutJob currently scans with @Scheduled.
rocketmq:
  name-server: ${ROCKETMQ_ADDR:127.0.0.1:9876}
  producer:
    group: maipiao-order-producer
    send-message-timeout: 5000
    retry-times-when-send-failed: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.maipiao.order.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

# Seata TC uses the published Docker port because services run on the host.
seata:
  enabled: true
  application-id: ${spring.application.name}
  # Must match the server-side vgroup mapping.
  tx-service-group: maipiao_tx_group
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      maipiao_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file

maipiao:
  jwt:
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}
  order:
    lock-minutes: 15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.maipiao: debug
    io.seata: info
