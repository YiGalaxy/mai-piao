server:
  port: 9000

spring:
  application:
    name: maipiao-gateway

  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8858}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

    gateway:
      # Strip /api before forwarding to the target service.
      routes:
        - id: maipiao-user
          uri: lb://maipiao-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        - id: maipiao-movie
          uri: lb://maipiao-movie
          predicates:
            - Path=/api/movie/**
          filters:
            - StripPrefix=1

        - id: maipiao-seat
          uri: lb://maipiao-seat
          predicates:
            - Path=/api/seat/**
          filters:
            - StripPrefix=1

        - id: maipiao-order
          uri: lb://maipiao-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        - id: maipiao-queue
          uri: lb://maipiao-queue
          predicates: [ Path=/api/queue/** ]
          filters: [ StripPrefix=1 ]
        - id: maipiao-pay
          uri: lb://maipiao-pay
          predicates:
            # Payment callbacks use the pay-service callback URL directly.
            - Path=/api/pay/**
          filters:
            - StripPrefix=1

      # Admin endpoints live under each business service's /admin path.

      globalcors:
        cors-configurations:
          '[/**]':
            # Development default. Restrict origins before deployment.
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:maipiao123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

maipiao:
  jwt:
    secret: ${MAIPIAO_JWT_SECRET:maipiao-ticket-local-dev-secret-key-change-me-in-production-2026}
    expire-minutes: 120
    admin-expire-minutes: 60

  gateway:
    auth:
      # All paths except these entries require a valid token.
      whitelist:
        - /api/user/login
        - /api/user/register
        # Public browsing endpoints. Queue position remains authenticated.
        - /api/movie/**
        - /api/seat/map/**
        - /actuator/health
      # Check the token blacklist on authenticated requests.
      check-blacklist: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.maipiao: debug
